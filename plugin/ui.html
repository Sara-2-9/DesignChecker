<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 12px/1.5 -apple-system, 'SF Pro Text', Inter, sans-serif;
    background: #1e1e1e; color: #e8e8e8; padding: 12px;
  }
  h1 { font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  button {
    background: #7c6cf0; color: #fff; border: 0; border-radius: 6px;
    padding: 6px 10px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.secondary { background: #333; }
  button:disabled { opacity: .4; cursor: default; }
  input[type=text] {
    background: #2c2c2c; border: 1px solid #444; border-radius: 6px;
    color: #e8e8e8; padding: 5px 8px; font: inherit; flex: 1; min-width: 0;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .dot.on { background: #30d158; } .dot.off { background: #ff453a; }
  #status { color: #999; font-size: 11px; }
  #findings { margin-top: 10px; overflow-y: auto; max-height: 300px; }
  .finding {
    border-left: 3px solid #666; padding: 6px 8px; margin-bottom: 6px;
    background: #262626; border-radius: 0 6px 6px 0;
  }
  .finding.error { border-color: #ff453a; }
  .finding.warning { border-color: #ff9f0a; }
  .finding.exception { border-color: #666; opacity: .8; }
  .finding .rule { font-weight: 700; font-size: 11px; }
  .finding.error .rule { color: #ff6961; }
  .finding.warning .rule { color: #ffb340; }
  .finding .node { color: #8ab4ff; font-size: 11px; }
  .finding .sugg { color: #9a9a9a; font-size: 11px; }
  .finding a { color: #6ab0ff; font-size: 11px; }
  .ok { color: #30d158; font-weight: 600; margin-top: 10px; }
  #ai-out { margin-top: 8px; max-height: 220px; overflow-y: auto; }
  #ai-out .critique { background: #26262e; border: 1px solid #3a3a4a; border-radius: 6px; padding: 8px; white-space: pre-wrap; }
  #ai-out .logline { color: #9a9a9a; font-size: 11px; padding: 1px 0; }
  label.toggle { display: flex; gap: 6px; align-items: center; color: #ccc; }
  select { background: #26262e; color: #eee; border: 1px solid #3a3a4a; border-radius: 6px; padding: 4px 6px; font-size: 12px; }
  hr { border: 0; border-top: 1px solid #333; margin: 12px 0; }
  .section { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .4px; margin-bottom: 6px; }
</style>
</head>
<body>
  <h1>DesignChecker</h1>
  <div class="row">
    <span class="dot off" id="dot"></span>
    <span id="status">bridge non raggiungibile — avvia: dck serve</span>
  </div>
  <div class="row">
    <label class="toggle" for="platform">Piattaforma:
      <select id="platform">
        <option value="ios" selected>iOS</option>
        <option value="android">Android</option>
        <option value="custom">Custom (quadra iOS/Android)</option>
        <option value="both">Entrambe (tutte le regole)</option>
      </select>
    </label>
  </div>
  <div class="row">
    <button id="btn-export" disabled>Esporta selezione e valida</button>
  </div>
  <div class="row">
    <label class="toggle">
      <input type="checkbox" id="watch" disabled> Tempo reale sul frame selezionato
    </label>
  </div>
  <div id="findings"></div>
  <div id="summary"></div>
  <hr>
  <div class="section">AI <span id="ai-model" style="color:#666;text-transform:none"></span></div>
  <div class="row">
    <button id="btn-review" class="secondary" disabled>Valuta il design</button>
    <button id="btn-fix" class="secondary" disabled>Correggi con AI</button>
  </div>
  <div class="row">
    <input type="text" id="ai-context" placeholder="contesto app (opzionale) — es. app di vibe coding…">
  </div>
  <div id="ai-out"></div>
  <hr>
  <div class="section">Scrivi su canvas</div>
  <div class="row">
    <input type="text" id="screen-id" list="screen-list" placeholder="id schermata (es. home2)">
    <datalist id="screen-list"></datalist>
    <button id="btn-render" class="secondary" disabled>Render</button>
  </div>
  <div class="row">
    <button id="btn-clear" class="secondary">Pulisci annotazioni</button>
  </div>

<script>
'use strict';
const BRIDGE = 'http://localhost:7357';
let lastMap = {};
let lastScreen = null;
let aiBusy = false;

const $ = (id) => document.getElementById(id);

async function bridge(path, options) {
  const res = await fetch(BRIDGE + path, options);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function boot() {
  try {
    const health = await bridge('/health');
    const [catalog, tokens] = await Promise.all([bridge('/catalog'), bridge('/tokens')]);
    parent.postMessage({ pluginMessage: { type: 'init-data', catalog, tokens } }, '*');
    $('dot').className = 'dot on';
    $('status').textContent = 'bridge attivo — DesignChecker v' + health.version +
      (health.autogen ? ' · autogen attivo' : '');
    $('btn-export').disabled = false;
    $('watch').disabled = false;
    $('btn-render').disabled = false;
    if (health.ai && health.ai.configured) {
      $('ai-model').textContent = '· ' + health.ai.label + ' ' + health.ai.model;
      $('btn-review').disabled = false;
      $('btn-fix').disabled = false;
    } else {
      $('ai-model').textContent = '· non configurata (dck ai)';
    }
    try {
      const list = await bridge('/screens');
      $('screen-list').innerHTML = (list.screens || [])
        .map((s) => '<option value="' + s + '">').join('');
    } catch (e) { /* niente autocompletamento: non blocca */ }
  } catch (e) {
    $('dot').className = 'dot off';
    $('status').textContent = 'bridge non raggiungibile — avvia: dck serve';
  }
}

function renderFindings(data) {
  const box = $('findings');
  box.innerHTML = '';
  if (data.notice) {
    const n = document.createElement('div');
    n.className = 'finding warning';
    n.innerHTML = '<div class="rule">⚠ attenzione</div><div>' + data.notice + '</div>';
    box.appendChild(n);
  }
  const findings = data.findings || [];
  const errors = findings.filter((f) => f.severity === 'error').length;
  $('summary').innerHTML = findings.length === 0
    ? '<div class="ok">✓ Nessuna violazione</div>'
    : '<div class="section">' + errors + ' errori · ' + (findings.length - errors) + ' warning</div>';
  for (const e of data.exceptions || []) {
    const div = document.createElement('div');
    div.className = 'finding exception';
    div.innerHTML = '<div class="rule">◦ eccezione</div><div class="sugg">' + e + '</div>';
    box.appendChild(div);
  }
  for (const f of findings) {
    const div = document.createElement('div');
    div.className = 'finding ' + f.severity;
    div.innerHTML =
      '<div class="rule">' + (f.severity === 'error' ? '✗ ' : '⚠ ') + f.rule_id + '</div>' +
      '<div class="node">Nodo: ' + f.node_id + '</div>' +
      '<div>' + f.message + '</div>' +
      (f.suggestion ? '<div class="sugg">→ ' + f.suggestion + '</div>' : '') +
      (f.source_url ? '<a href="' + f.source_url + '" target="_blank">' + f.source + '</a>' : '');
    box.appendChild(div);
  }
  parent.postMessage({ pluginMessage: { type: 'annotate', findings, map: lastMap } }, '*');
}

async function validateScreen(screen, assets) {
  lastScreen = screen;
  const data = await bridge('/import', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ screen: screen, assets: assets || [],
                           platform: $('platform').value }),
  });
  renderFindings(data);
  $('status').textContent = 'audit salvato: ' + (data.path || '').split('/').pop() +
    ' [' + (data.platform || $('platform').value) + ']';
  appStatus(data.app);
}

// D36: esito dell'autogen (progetto Expo rigenerato dal bridge)
function appStatus(app) {
  if (!app) return;
  if (app.ok) {
    $('status').textContent += app.metro
      ? ' · app aggiornata (Metro attivo: si ricarica da sola)'
      : ' · app aggiornata — prima volta? cd ' + app.path + ' && npm install && npx expo start';
  } else {
    $('status').textContent += ' · autogen fermo: ' + app.error;
  }
}

function aiOut(html) { $('ai-out').innerHTML = html; }

function setAiBusy(busy, label) {
  aiBusy = busy;
  $('btn-review').disabled = busy;
  $('btn-fix').disabled = busy;
  if (label) $('status').textContent = label;
}

// I bottoni AI lavorano su lastScreen: se il plugin e' appena stato riaperto
// la memoria e' vuota — prova a caricare lo screen dal campo id, altrimenti
// spiega cosa fare (mai un click silenzioso).
async function ensureScreen() {
  if (lastScreen) return true;
  const id = $('screen-id').value.trim();
  if (id) {
    try {
      lastScreen = await bridge('/screen/' + encodeURIComponent(id));
      if (lastScreen.meta && lastScreen.meta.platform) {
        $('platform').value = lastScreen.meta.platform;  // D39: eredita la piattaforma dichiarata
      }
      $('status').textContent = 'screen "' + id + '" caricato dal bridge';
      return true;
    } catch (e) { /* cade nel messaggio sotto */ }
  }
  $('status').textContent = 'prima esporta e valida una selezione (o scrivi l\'id della schermata nel campo Render e riprova)';
  return false;
}

$('btn-review').onclick = async () => {
  if (aiBusy) return;
  if (!(await ensureScreen())) return;
  setAiBusy(true, 'valutazione AI in corso…');
  aiOut('');
  try {
    const data = await bridge('/review', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ screen: lastScreen, context: $('ai-context').value.trim() || undefined,
                             platform: $('platform').value }),
    });
    if (data.error) { aiOut('<div class="finding error"><div>' + data.error + '</div></div>'); }
    else {
      aiOut('<div class="critique">' + data.critique.replace(/</g, '&lt;') + '</div>');
      $('status').textContent = 'valutazione pronta (consultiva: il validatore resta l\'arbitro)';
    }
  } catch (e) {
    $('status').textContent = 'bridge irraggiungibile durante la valutazione';
  }
  setAiBusy(false);
};

$('btn-fix').onclick = async () => {
  if (aiBusy) return;
  if (!(await ensureScreen())) return;
  setAiBusy(true, 'fix AI in corso: il validatore fara\' da gatekeeper…');
  aiOut('');
  try {
    const data = await bridge('/fix', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ screen: lastScreen, context: $('ai-context').value.trim() || undefined,
                             platform: $('platform').value }),
    });
    if (data.error) { aiOut('<div class="finding error"><div>' + data.error + '</div></div>'); }
    else {
      aiOut((data.log || []).map((l) => '<div class="logline">' + l.replace(/</g, '&lt;') + '</div>').join('') +
        (data.applied
          ? '<div class="ok">✓ Patch applicata e salvata — renderizzo la versione corretta</div>'
          : '<div class="finding warning"><div>Nessuna patch accettabile: file invariato</div></div>'));
      if (data.applied && data.screen) {
        $('status').textContent = 'fix applicato';
        appStatus(data.app);
        lastScreen = data.screen;
        renderFindings(await bridge('/validate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ screen: data.screen, platform: $('platform').value }),
        }));
        parent.postMessage({ pluginMessage: { type: 'render', screen: data.screen } }, '*');
      }
    }
  } catch (e) {
    $('status').textContent = 'bridge irraggiungibile durante il fix';
  }
  setAiBusy(false);
};

window.onmessage = async (event) => {
  const msg = event.data.pluginMessage;
  if (!msg) return;
  if (msg.type === 'screen-exported') {
    lastMap = msg.map || {};
    try {
      await validateScreen(msg.screen, msg.assets);
      // Diagnostica D34: quanti nodi immagine/icona trovati, quanti PNG esportati.
      // Se manca assets_debug, il code.js in esecuzione e' una versione vecchia.
      if (msg.assets_debug) {
        $('status').textContent += ' · asset: ' + msg.assets_debug.sent + '/' + msg.assets_debug.found +
          (msg.assets_debug.sent > 0 ? ' salvati' : ' — nessun PNG esportato');
      } else {
        $('status').textContent += ' · nessun asset nel messaggio: il code.js in esecuzione e\' vecchio, re-importa il plugin dal manifest';
      }
    } catch (e) {
      $('status').textContent = 'bridge irraggiungibile durante la validazione';
    }
  }
  if (msg.type === 'error') {
    $('status').textContent = msg.message;
  }
  if (msg.type === 'rendered') {
    $('status').textContent = '✓ Creato sul canvas: ' + msg.name;
  }
};

$('btn-export').onclick = () => {
  parent.postMessage({ pluginMessage: { type: 'export-selection' } }, '*');
};

// D39: cambiare piattaforma rivalida subito lo screen corrente (senza scrivere)
$('platform').onchange = async () => {
  if (!lastScreen) return;
  try {
    renderFindings(await bridge('/validate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ screen: lastScreen, platform: $('platform').value }),
    }));
    $('status').textContent = 'rivalidato per piattaforma: ' + $('platform').value;
  } catch (e) {
    $('status').textContent = 'bridge irraggiungibile durante la rivalidazione';
  }
};

$('watch').onchange = (e) => {
  parent.postMessage({ pluginMessage: { type: e.target.checked ? 'watch-start' : 'watch-stop' } }, '*');
  $('status').textContent = e.target.checked
    ? 'tempo reale attivo: modifica il frame e guarda qui'
    : 'tempo reale disattivato';
};

$('btn-render').onclick = async () => {
  const id = $('screen-id').value.trim();
  if (!id) return;
  try {
    const screen = await bridge('/screen/' + encodeURIComponent(id));
    parent.postMessage({ pluginMessage: { type: 'render', screen } }, '*');
  } catch (e) {
    $('status').textContent = 'screen "' + id + '" non trovato (importalo prima)';
  }
};

$('btn-clear').onclick = () => {
  parent.postMessage({ pluginMessage: { type: 'clear-annotations' } }, '*');
};

boot();
</script>
</body>
</html>
