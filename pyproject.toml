[project]
name = "designchecker"
version = "0.1.0"
description = "Dal design all'app reale, con le regole ufficiali dalla tua parte."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
dc = "designchecker.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["designchecker"]
